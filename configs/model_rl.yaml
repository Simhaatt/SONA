defaults: default.yaml

model:
  kind: rl_attention   # rl_attention (flagship) | rl_gru
  hidden: 128
  n_layers: 3
  n_heads: 4
  causal: true

train:
  epochs: 20
  batch_size: 8
  lr: 0.0003
  value_coef: 0.5
  entropy_coef: 0.01
  crop_seconds: 2.0

online:
  steps: 8            # inference-time adaptation steps per utterance
  lr: 0.1

data:
  synthetic:
    n: 60
    duration: 2.0
    snr_db_range: [-5.0, 10.0]
  val_synthetic:
    n: 24
    duration: 2.0
    snr_db_range: [-5.0, 10.0]
